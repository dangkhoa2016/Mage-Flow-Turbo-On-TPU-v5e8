name: CI

on:
  push:
  pull_request:

jobs:
  cpu-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q runtime bootstrap tests

      - name: Run CPU regression tests
        env:
          KERAS_BACKEND: jax
        run: pytest -q tests/test_cpu_regressions.py
